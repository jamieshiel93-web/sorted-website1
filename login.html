<!DOCTYPE html>
<html lang="en-GB">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Client Login | Sorted.</title>

<meta
  name="robots"
  content="noindex, nofollow"
>

<meta
  name="theme-color"
  content="#17261b"
>

<link
  rel="icon"
  href="favicon.png"
  type="image/png"
>

<link
  rel="apple-touch-icon"
  href="favicon.png"
>

<link
  rel="canonical"
  href="https://sortedlife.org.uk/portal/"
>


<!--
  Fallback redirect for browsers with JavaScript disabled.
-->
<meta
  http-equiv="refresh"
  content="2; url=portal/index.html"
>


<style>

/* ==================================================
   ROOT
================================================== */

:root{

  --cream:#f8f1e7;
  --cream-soft:#fffaf4;

  --forest:#17261b;
  --sage:#314632;

  --gold:#caa76a;
  --gold-soft:#dec28d;

  --ink:#1d241f;
  --muted:#6f746e;

}


/* ==================================================
   RESET
================================================== */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  min-height:100%;
}

body{

  min-height:100svh;

  display:flex;

  align-items:center;
  justify-content:center;

  overflow:hidden;

  padding:25px;

  background:

    radial-gradient(
      circle at 15% 10%,
      rgba(202,167,106,.14),
      transparent 32%
    ),

    radial-gradient(
      circle at 88% 82%,
      rgba(113,140,103,.12),
      transparent 34%
    ),

    var(--cream);

  color:var(--ink);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Helvetica,
    Arial,
    sans-serif;

}


/* ==================================================
   DECORATION
================================================== */

body::before{

  content:"";

  position:fixed;

  top:-180px;
  right:-150px;

  width:430px;
  height:430px;

  border:
    1px solid rgba(202,167,106,.20);

  border-radius:50%;

  pointer-events:none;

}

body::after{

  content:"";

  position:fixed;

  left:-190px;
  bottom:-210px;

  width:390px;
  height:390px;

  border:
    1px solid rgba(113,140,103,.15);

  border-radius:50%;

  pointer-events:none;

}


/* ==================================================
   LOGIN TRANSITION
================================================== */

.redirect-card{

  position:relative;

  z-index:2;

  width:min(520px,100%);

  padding:
    52px 44px 45px;

  overflow:hidden;

  border:
    1px solid rgba(202,167,106,.28);

  border-radius:32px;

  background:
    rgba(255,250,244,.93);

  box-shadow:
    0 28px 75px rgba(23,38,27,.14);

  text-align:center;

  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);

}

.redirect-card::before{

  content:"";

  position:absolute;

  top:-90px;
  right:-90px;

  width:200px;
  height:200px;

  border-radius:50%;

  background:
    rgba(202,167,106,.07);

  pointer-events:none;

}


/* ==================================================
   BRAND
================================================== */

.logo{

  display:inline-block;

  margin-bottom:30px;

  color:var(--forest);

  font-size:2.7rem;
  font-weight:850;

  letter-spacing:-2px;

}

.logo span{
  color:var(--gold);
}


/* ==================================================
   ICON
================================================== */

.portal-icon{

  position:relative;

  width:68px;
  height:68px;

  display:flex;

  align-items:center;
  justify-content:center;

  margin:
    0 auto 25px;

  border:
    1px solid rgba(202,167,106,.32);

  border-radius:50%;

  background:
    rgba(202,167,106,.10);

}

.portal-icon::before{

  content:"";

  width:16px;
  height:20px;

  border:
    2px solid var(--forest);

  border-radius:4px;

}

.portal-icon::after{

  content:"";

  position:absolute;

  top:18px;

  width:10px;
  height:9px;

  border:
    2px solid var(--forest);

  border-bottom:0;

  border-radius:
    8px 8px 0 0;

}


/* ==================================================
   COPY
================================================== */

.eyebrow{

  margin-bottom:11px;

  color:var(--gold);

  font-size:.7rem;
  font-weight:850;

  letter-spacing:2.5px;

  text-transform:uppercase;

}

h1{

  margin-bottom:15px;

  color:var(--forest);

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:
    clamp(2.15rem,7vw,3rem);

  font-weight:500;

  line-height:1.02;

  letter-spacing:-1.7px;

}

.description{

  width:min(390px,100%);

  margin:0 auto;

  color:var(--muted);

  font-size:.96rem;

  line-height:1.72;

}


/* ==================================================
   LOADING LINE
================================================== */

.loading-track{

  width:min(270px,75%);

  height:2px;

  margin:
    30px auto 25px;

  overflow:hidden;

  border-radius:999px;

  background:
    rgba(23,38,27,.09);

}

.loading-bar{

  width:45%;
  height:100%;

  border-radius:999px;

  background:
    linear-gradient(
      90deg,
      var(--gold),
      var(--sage)
    );

  animation:
    loading 1.15s ease-in-out infinite;

}


/* ==================================================
   FALLBACK LINK
================================================== */

.fallback{

  color:var(--muted);

  font-size:.8rem;

  line-height:1.55;

}

.fallback a{

  color:var(--sage);

  font-weight:800;

  text-decoration:none;

}

.fallback a:hover{
  color:var(--gold);
}


/* ==================================================
   MOBILE
================================================== */

@media(max-width:520px){

  body{
    padding:18px;
  }

  .redirect-card{

    padding:
      42px 23px 36px;

    border-radius:26px;

  }

  .logo{

    margin-bottom:26px;

    font-size:2.35rem;

  }

  .portal-icon{

    width:60px;
    height:60px;

    margin-bottom:22px;

  }

  h1{

    font-size:2.15rem;

  }

  .description{

    font-size:.91rem;

  }

}


/* ==================================================
   ACCESSIBILITY
================================================== */

a:focus-visible{

  outline:
    3px solid var(--gold);

  outline-offset:4px;

}


/* ==================================================
   REDUCED MOTION
================================================== */

@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{

    animation-duration:.01ms !important;

    animation-iteration-count:1 !important;

    transition-duration:.01ms !important;

  }

}


/* ==================================================
   ANIMATION
================================================== */

@keyframes loading{

  0%{
    transform:translateX(-130%);
  }

  50%{
    transform:translateX(65%);
  }

  100%{
    transform:translateX(230%);
  }

}

</style>


<script>

/*
  JavaScript redirect.
  Slight delay allows the branded transition screen
  to appear instead of flashing a blank page.
*/

window.addEventListener(
  "DOMContentLoaded",
  function(){

    setTimeout(
      function(){

        window.location.replace(
          "portal/index.html"
        );

      },
      850
    );

  }
);

</script>

</head>


<body>


<main class="redirect-card">


  <a
    href="index.html"
    class="logo"
    aria-label="Sorted homepage"
  >
    Sorted<span>.</span>
  </a>


  <div
    class="portal-icon"
    aria-hidden="true"
  ></div>


  <p class="eyebrow">
    Client Portal
  </p>


  <h1>
    Taking you to<br>
    My Sorted.
  </h1>


  <p class="description">
    Your secure client area for managing your
    Sorted. support.
  </p>


  <div
    class="loading-track"
    aria-hidden="true"
  >

    <div class="loading-bar"></div>

  </div>


  <p class="fallback">

    Redirecting now.

    If nothing happens,

    <a href="portal/index.html">
      continue to Client Login
    </a>.

  </p>


</main>


</body>

</html>
